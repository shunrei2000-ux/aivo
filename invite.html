<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIVOの招待</title>
<meta property="og:title" content="AIVOをいっしょに育てよう">
<meta property="og:description" content="声で育てる、あなたの分身AI。招待コードで同じ子をいっしょに育てられます。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--night:#06070c;--fg:#e8ebf4;--muted:#8d93a8;--glow:#9fd8ff;--hair:rgba(220,228,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 70% at 50% 0%,#1a2140 0%,var(--night) 62%) fixed;color:var(--fg);font:16px/1.7 "Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 48px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.orb{width:120px;height:120px;margin:0 auto 4px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#c9e9ff 0,#7fb6ff 30%,#7a5cff 55%,rgba(122,92,255,0) 72%);box-shadow:0 0 60px rgba(159,216,255,.45);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);filter:hue-rotate(40deg)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
h1{margin:0;text-align:center;font-family:"Klee One",serif;font-weight:600;font-size:1.7rem;line-height:1.4;text-shadow:0 0 24px rgba(159,216,255,.5)}
p{margin:0;color:var(--muted);text-align:center;font-size:.92rem}
.code{font-weight:700;font-size:2.4rem;letter-spacing:.3em;text-align:center;padding:10px 0 10px .3em;border:1px dashed var(--hair);border-radius:16px;background:rgba(14,17,28,.6);font-variant-numeric:tabular-nums}
a.btn{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:999px;padding:15px 18px;font-size:1rem}
.primary{background:var(--fg);color:var(--night)}
.secondary{border:1px solid var(--hair);color:var(--fg)}
ol{margin:0;padding-left:1.3em;color:var(--muted);font-size:.88rem}
footer{text-align:center;font-size:.75rem;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true"></div>
  <h1>AIVOを<br>いっしょに育てよう</h1>
  <p>声で育てる、あなたの分身AI。<br>このコードで、同じ子をいっしょに育てられます。</p>
  <div class="code" id="code">------</div>
  <a class="btn primary" id="open" href="#">AIVOで開いて参加する</a>
  <a class="btn secondary" id="store" href="#">App Storeで入手する</a>
  <ol>
    <li>まだアプリがない人は、App Storeで入手して一度開いてください。</li>
    <li>このページに戻って「AIVOで開いて参加する」をタップ。</li>
    <li>うまく開かないときは、アプリの「設定」（歯車のボタン）→「いっしょに育てる」→「招待コードを入力する」で上のコードを入れてください。</li>
  </ol>
  <footer><a href="index.html">サポート</a>　<a href="privacy.html">プライバシーポリシー</a></footer>
</main>
<script>
var APP_STORE_ID='6824186064'.replace(/\D/g,'');
var code=(new URLSearchParams(location.search).get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
document.getElementById('code').textContent=code||'------';
document.getElementById('open').href='aivo://join?code='+encodeURIComponent(code);
document.getElementById('store').href=APP_STORE_ID?'https://apps.apple.com/jp/app/id'+APP_STORE_ID:'index.html';
</script>
</body>
</html>
